# T&R -- distro definition.
#
# This file IS the distro. Everything about the produced image that is a choice
# rather than a mechanism lives here; build-image.sh is the mechanism and should
# not need editing to make a different flavour.
#
# NAME is a placeholder -- rename it and the image, hostname and MOTD follow.

DISTRO_NAME="T&R"
# Paths, GPT label and hostname use the SLUG; "&" is invalid in a hostname
# and needs quoting everywhere else. Only prose uses DISTRO_NAME.
DISTRO_SLUG="tandr"
DISTRO_VERSION="0.1"
DISTRO_CODENAME="drive-in"

# Which FreeBSD pkgbase release to assemble from. This is the ONLY place the
# upstream version is named.
FREEBSD_MAJOR="15"
BASE_REPO="FreeBSD-base"

# Base system, from pkgbase. FreeBSD-runtime + a kernel is the minimum that
# boots; everything else here is a deliberate addition.
#
# Deliberately absent: FreeBSD-tests (~200 MB of test suites), -dbg packages,
# and all lib32 packages. A VPS guest image has no use for any of them, and
# they are most of what makes a stock image large.
#
# FreeBSD-rc and FreeBSD-pam are NOT optional and NOT pulled in as
# dependencies. Without FreeBSD-rc there is no /etc/rc at all, so the kernel
# boots, mounts root, and drops straight to "Enter full pathname of shell" --
# which looks like a broken image rather than a missing package. Without
# FreeBSD-pam sshd cannot authenticate anyone.
# FreeBSD-ufs, FreeBSD-geom and FreeBSD-utilities are the other three that look
# optional and are not, for a UFS-rooted image:
#   ufs       -> fsck_ufs and growfs. Without fsck_ufs, /etc/rc's filesystem
#                check fails and aborts the boot into single-user mode.
#   geom      -> gpart, which growfs shells out to in order to expand the
#                partition before growing the filesystem.
#   utilities -> awk, which the rc scripts use constantly.
#
# NOTE: this list is a shell string, so it cannot carry comments inside it --
# a '#' line between the quotes becomes package names and pkg then reports
# "No packages available to install matching 'the'".
BASE_PKGS="
FreeBSD-runtime
FreeBSD-rc
FreeBSD-pam
FreeBSD-ufs
FreeBSD-geom
FreeBSD-utilities
FreeBSD-kernel-generic
FreeBSD-bootloader
FreeBSD-ssh
FreeBSD-devd
FreeBSD-syslogd
FreeBSD-cron
FreeBSD-certctl
FreeBSD-caroot
FreeBSD-resolvconf
FreeBSD-dhclient
FreeBSD-pkg-bootstrap
FreeBSD-libarchive
FreeBSD-fetch
FreeBSD-vi
FreeBSD-zfs
FreeBSD-nuageinit
"

# Ports packages, from the standard pkg repo.
PORT_PKGS="
sudo
"

# What the verifiable stack needs, installed ONLY when the build is actually
# carrying it (STACK_DIST set). TRVM and TRAAVIIS are pure python against the
# standard library, so the stack needs no toolchain on the target -- but it does
# need an interpreter, and pkgbase does not carry one. Without it a STACK_DIST
# build produces an image with /usr/local/bin/trvs on it and nothing to execute
# it: `trvs doctor` exits "python3: not found", which reads as a broken stack
# rather than a missing package.
#
# Kept out of PORT_PKGS because the interpreter is most of what it costs. The
# stack itself is 14 MB; python takes the server image from 364 MB to 625 MB and
# 50 packages to 56. A bare server image should not pay that to ship sshd and
# cron, so the size of the distro follows what it is actually for.
#
# The desktop flavour carries python3 in PORT_PKGS regardless, because the
# RRABBIT bridge needs it with or without the stack. That is why this gap only
# ever showed on the server image -- the one the substrate is meant to be.
STACK_PKGS="
python3
"

# Services enabled in the image's rc.conf.
RC_SERVICES="
sshd
nuageinit
growfs
devd
syslogd
cron
"

# Root filesystem size for the produced image. The instance overlay is grown at
# create time, so this only needs to hold the image itself plus headroom.
ROOT_SIZE="3g"
ESP_SIZE="33m"
