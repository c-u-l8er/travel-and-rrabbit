# T&R Desktop -- the same distro with a graphical seat.
#
# A SEPARATE flavour rather than options bolted onto tandr.conf: X.org and a
# window manager are ~500 MB, and the whole point of the server image is that an
# instance costs 51 MB. Two configs, one build script.
#
# Requires the instance to have a display adapter:
#   vps.py create NAME --golden T&R-DESKTOP-0.1.qcow2 --graphics std --start

DISTRO_NAME="T&R Desktop"
# Paths, GPT label and hostname use the SLUG; "&" is invalid in a hostname
# and needs quoting everywhere else. Only prose uses DISTRO_NAME.
DISTRO_SLUG="tandr-desktop"
DISTRO_VERSION="0.1"
DISTRO_CODENAME="drive-in"

FREEBSD_MAJOR="15"
BASE_REPO="FreeBSD-base"

# Identical to tandr.conf. If these ever diverge, the two images stop being
# the same system with and without a screen, which is the only thing that makes
# the pair worth having.
#
# NOTE: this list is a shell string, so it cannot carry comments inside it --
# a '#' line between the quotes becomes package names.
BASE_PKGS="
FreeBSD-runtime
FreeBSD-rc
FreeBSD-pam
FreeBSD-ufs
FreeBSD-geom
FreeBSD-utilities
FreeBSD-kernel-generic
FreeBSD-bootloader
FreeBSD-ssh
FreeBSD-devd
FreeBSD-syslogd
FreeBSD-cron
FreeBSD-certctl
FreeBSD-caroot
FreeBSD-resolvconf
FreeBSD-dhclient
FreeBSD-pkg-bootstrap
FreeBSD-libarchive
FreeBSD-fetch
FreeBSD-vi
FreeBSD-zfs
FreeBSD-nuageinit
"

# xf86-video-scfb, not vesa: scfb draws on the framebuffer UEFI already set up,
# so it needs no mode-setting driver and no DRM kernel module matched to the
# kernel. That is the difference between a desktop that comes up on a stock
# GENERIC kernel and one that needs drm-kmod.
#
# icewm rather than XFCE: it has a taskbar and a menu, so it reads as a desktop
# rather than as a bare X root window, and it is 6 MB instead of ~1 GB. Swapping
# it is a one-line change here plus the WM name in DESKTOP_SESSION.
# FONTS ARE NOT OPTIONAL AND xorg-minimal DOES NOT PULL ANY.
# It installs the font LIBRARIES (freetype, fontconfig, libXft) and zero font
# FILES -- `fc-list` returns 0 on a fresh image. The damage is much worse than
# missing text:
#   * icewm draws menus, titles and taskbar as blank strips (icons only)
#   * icewm ALSO stops moving windows -- press, drag, release moved a window by
#     exactly its decoration offset and no further, which reads as "click and
#     drag is broken" and sent me through VNC, noVNC, the proxy, the pointer
#     device and X before the cause turned out to be here
#   * fluxbox refuses to start at all: "Failed to load default value 'fixed'"
# font-misc-misc is what provides the core 'fixed' font a WM falls back to;
# dejavu is what fontconfig resolves "sans-serif" to.
#
# python3 is here for the RRABBIT bridge, which serves the shell AND reads the
# seven system gauges with the standard library only -- no node on the target.
#
# firefox is the real answer to "a browser", at ~334 MiB packaged. Lighter
# swaps that work here: netsurf (4.6 MiB, own engine, weak JS), dillo (1.7 MiB,
# no JS), badwolf/luakit (WebKitGTK). Change the one line.
PORT_PKGS="
sudo
xorg-minimal
xinit
xauth
xf86-video-scfb
xf86-input-libinput
icewm
tint2
xwallpaper
xterm
dbus
dejavu
liberation-fonts-ttf
font-misc-misc
font-cursor-misc
firefox
xdotool
sddm
python3
"

RC_SERVICES="
sshd
nuageinit
growfs
devd
syslogd
cron
dbus
parkvps_fccache
"

# Turns on the graphical stanza in build-image.sh.
DESKTOP="yes"
DESKTOP_SESSION="icewm-session"

# The cockpit theme: wallpaper, icewm colours, and the vertical tint2 panel.
# Named per-flavour so none of it lands in the server image.
OVERLAY_DIR="overlay-desktop"

# SDDM instead of autologin-into-startx. Its greeters are QML, so the login
# screen can be an instrument panel rather than a themed box -- themes/tandr.
# Costs 127 packages / ~966 MiB (qt6-base + qt6-declarative + consolekit2),
# which is why ROOT_SIZE below is 9g. Leave DISPLAY_MANAGER empty to go back to
# autologin; build-image.sh sets up exactly one of the two, never both.
DISPLAY_MANAGER="sddm"

# A greeter needs somebody to greet. Root is refused for graphical login and the
# nuageinit user has a locked password, so the image ships a desktop user.
# THIS PASSWORD IS PUBLIC -- it is in this file. It is defensible only because
# these guests are reachable through a unix socket on one machine and root
# already has an empty password on a `secure` console. Change it before
# anything here listens on a real address.
DESKTOP_USER="driver"
# PINNED, and deliberately the same as the username: every desktop build logs in
# as driver / driver. Leaving this empty generates a fresh secret per build,
# which is what it used to do -- traded away on purpose. An unguessable password
# buys nothing on an image whose entire point is that a stranger boots it in a VM
# and looks around; all it bought was making the first thing anyone had to do a
# hunt through /root/DESKTOP-LOGIN. This is now a known credential on a public
# image, which is the same posture the console already takes with root's empty
# password -- see the warning above, and change BOTH before anything here
# listens on a real address.
DESKTOP_PASSWORD="driver"

# Which session the greeter offers first. The image ships two -- `rrabbit` (the
# road, the thing this distribution is for) and `tandr` (icewm + tint2, the
# fallback that must keep existing so a bug in a 3D shell is never a machine you
# cannot use). It shipped defaulting to the fallback, so every login landed in
# icewm and the road was reachable only by pressing F2 at the greeter, which
# nothing told you. A distribution should boot into the thing it is for.
DEFAULT_SESSION="rrabbit"

# X.org, its fonts and icewm do not fit in the server image's 3 GB.
ROOT_SIZE="9g"
ESP_SIZE="33m"
